name: iosApp
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16"
configs:
  # Debug and Release keep their existing semantics (Prod scheme).
  # Debug-Mock and Release-Mock are new configurations for the Mock scheme.
  debug: debug
  release: release
  debug-mock: debug
  release-mock: release
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: JKHA7D462N
      configs:
        # Prod scheme configs — bundle id and name set inline for Debug, xcconfig for Release.
        debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.gasguru.debug
          PRODUCT_NAME: GasGuru Debug
        release:
          baseConfiguration: Config/gasguru-prod.xcconfig
        # Mock scheme configs — xcconfig generated by EnvironmentsConventionPlugin.
        debug-mock:
          baseConfiguration: Config/gasguru-mock.xcconfig
        release-mock:
          baseConfiguration: Config/gasguru-mock.xcconfig
schemes:
  GasGuru-Prod:
    build:
      targets:
        iosApp: all
    run:
      config: debug
    test:
      config: debug
    profile:
      config: release
    analyze:
      config: debug
    archive:
      config: release
  GasGuru-Mock:
    build:
      targets:
        iosApp: all
    run:
      config: debug-mock
    test:
      config: debug-mock
    profile:
      config: release-mock
    analyze:
      config: debug-mock
    archive:
      config: release-mock
